name: labarchive

services:
  db:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labarchive}
      POSTGRES_USER: ${POSTGRES_USER:-labarchive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labarchive-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labarchive} -d ${POSTGRES_DB:-labarchive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      LABARCHIVE_ENV: development
      LABARCHIVE_SECRET_KEY: ${LABARCHIVE_SECRET_KEY:-docker-development-only-change-me}
      LABARCHIVE_DEBUG: "true"
      LABARCHIVE_ALLOWED_HOSTS: 127.0.0.1,localhost
      POSTGRES_DB: ${POSTGRES_DB:-labarchive}
      POSTGRES_USER: ${POSTGRES_USER:-labarchive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labarchive-local-only}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      LABARCHIVE_MEDIA_ROOT: /data/labarchive/media
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - media_data:/data/labarchive/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
