name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: labarchive
          POSTGRES_USER: labarchive
          POSTGRES_PASSWORD: labarchive-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labarchive -d labarchive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      LABARCHIVE_ENV: test
      LABARCHIVE_SECRET_KEY: ci-only-not-a-production-secret
      POSTGRES_DB: labarchive
      POSTGRES_USER: labarchive
      POSTGRES_PASSWORD: labarchive-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest --cov --cov-report=term-missing
