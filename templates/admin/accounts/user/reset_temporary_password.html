{% extends "admin/base_site.html" %}

{% block content %}
  <div id="content-main">
    <h1>为 {{ original }} 生成一次性临时密码</h1>
    {% if temporary_password %}
      <p class="success">密码已重置。下面的临时密码只显示这一次，请立即通过线下安全方式交付。</p>
      <p><code id="temporary-password">{{ temporary_password }}</code></p>
      <p>用户下次登录后必须先修改密码。</p>
      <p><a href="{% url 'admin:accounts_user_change' original.pk %}">返回用户页面</a></p>
    {% else %}
      <p>确认后将使该用户现有密码失效，并生成随机临时密码。</p>
      <form method="post">
        {% csrf_token %}
        <input type="submit" value="确认生成临时密码" class="default">
        <a href="{% url 'admin:accounts_user_change' original.pk %}" class="button cancel-link">取消</a>
      </form>
    {% endif %}
  </div>
{% endblock %}
