{% extends "base.html" %}

{% block title %}修改密码 · LabArchive{% endblock %}

{% block content %}
  <section class="card auth-card">
    <h1>{% if request.user.must_change_password %}首次登录，请设置新密码{% else %}修改密码{% endif %}</h1>
    <p>新密码至少 12 位，不能是常见密码、纯数字或与账号信息过于相似。</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">保存新密码</button>
    </form>
  </section>
{% endblock %}
